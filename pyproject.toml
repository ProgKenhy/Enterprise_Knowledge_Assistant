[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "eka"
version = "0.1.0"
description = "Enterprise RAG system"
authors = [
    {name = "ProgKenhy",email = "sashok20053@gmail.com"}
]
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/eka"]

dependencies = [
    # Web
    "fastapi[standard]>=0.115.0",   # includes uvicorn, python-multipart, httpx
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",              # async PostgreSQL driver
    "alembic>=1.13.0",

    # Config & Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Auth
    "PyJWT[crypto]>=2.8.0",         # [crypto] нужен для RS256
    "bcrypt>=4.1.0",                 # хэширование паролей
    "passlib[bcrypt]>=1.7.4",

    # Files
    "aiofiles>=23.2.0",             # async запись файлов
    "python-multipart>=0.0.9",      # multipart/form-data
    "pymupdf>=1.24.0",              # чтение PDF (шаг 3)
    "python-docx>=1.1.0",           # чтение DOCX (шаг 3)
    "trafilatura>=1.12.0",          # извлечение текста из HTML (шаг 3)

    # Utils
    "python-slugify>=8.0.0",

    # Cache & Queue
    "redis[hiredis]>=5.0.0",
    "celery[rabbitmq]>=5.4.0",

    # Vector DB
    "qdrant-client>=1.9.0",


]



# ──────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = "-p no:anyio"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:argon2"
]


# ──────────────────────────────────────────────────────────────
# Ruff — линтер + форматтер (заменяет flake8, isort, black)
# ──────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (неиспользуемые импорты и т.д.)
    "I",   # isort (порядок импортов)
    "B",   # bugbear (распространённые баги)
    "UP",  # pyupgrade (современный синтаксис Python)
    "N",   # pep8-naming
]
ignore = [
    "B008", # do not perform function call in default args (Depends() в FastAPI)
    "N805", # first argument of a method should be named 'self' (ломает Pydantic validator)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]


# ──────────────────────────────────────────────────────────────
# Mypy — опциональная статическая типизация
# ──────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = false              # включи когда будет готов: проверяет все типы
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
[dependency-groups]
dev = [
    # Tests
    "testcontainers[postgresql] (>=4.14.2,<5.0.0)",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",

    # Linting & Formatting
    "ruff>=0.4.0",
    "mypy>=1.10.0",

    # Type stubs
    "types-aiofiles",
    "types-passlib",
]
