[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[project]
name = "eka"
version = "0.1.0"
description = "Enterprise RAG system"
authors = [{name = "ProgKenhy", email = "sashok20053@gmail.com"}]
requires-python = ">=3.11"

dependencies = [
    # Web
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",

    # Config & Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Auth
    "PyJWT[crypto]>=2.8.0",
    "bcrypt>=4.1.0",
    "passlib[bcrypt]>=1.7.4",

    # Files
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "trafilatura>=1.12.0",

    # Utils
    "python-slugify>=8.0.0",
    "uuid6>=2024.1.12",

    # Cache & Queue
    "redis[hiredis]>=5.0.0",
    "celery[rabbitmq]>=5.4.0",

    # Vector DB
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",

    # Embeddings & LLM
    "tiktoken>=0.7.0",
    "openai>=1.30.0",
    "argon2-cffi (>=25.1.0,<26.0.0)",
]


[tool.poetry]

package-mode = false

# ──────────────────────────────────────────────────────────────
# PEP 735: dev-зависимости
# Устанавливаются через: poetry install --with dev
# ──────────────────────────────────────────────────────────────

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[postgresql]>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-aiofiles",
    "types-passlib",
]

# ──────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = "-p no:anyio"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:argon2",
]

# ──────────────────────────────────────────────────────────────
# Ruff
# ──────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]
ignore = [
    "B008",
    "N805",
]

[tool.ruff.lint.isort]
known-first-party = ["eka"]

# ──────────────────────────────────────────────────────────────
# Mypy
# ──────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]