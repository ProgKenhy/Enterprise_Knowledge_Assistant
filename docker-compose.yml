services:

  api:
    build: .
    container_name: rag_api
    restart: unless-stopped
    env_file: .env
    environment:
      - FASTEMBED_CACHE_DIR=/app/.cache/fastembed
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./keys:/app/keys
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - rag_net
    entrypoint: [ "/entrypoint.sh" ]
    command: uvicorn eka.main:app --host 0.0.0.0 --reload

  worker:
    build: .
    container_name: rag_worker
    restart: unless-stopped
    env_file: .env
    environment:
      - FASTEMBED_CACHE_DIR=/app/.cache/fastembed
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./keys:/app/keys
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rag_net
    command: celery -A eka.tasks.celery_app worker --loglevel=info -Q indexing

  postgres:
    image: postgres:18
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT_FORWARD}:5432"
    networks:
      - rag_net

  qdrant:
    build:
      context: .
      dockerfile: Dockerfile.qdrant
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - rag_net

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 10
    networks:
      - rag_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rag_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rag_net

  # ──────────────────────────────────────────────
  # Мониторинг и Observability
  # ──────────────────────────────────────────────
  
  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: rag_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - rag_net

  grafana:
    image: grafana/grafana:13.0.2
    container_name: rag_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Можно добавить предварительно настроенные дашборды:
      # - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - rag_net
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:v1.11.1
    container_name: rag_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - rag_net

  # ──────────────────────────────────────────────
  # Логирование (Loki + Promtail)
  # ──────────────────────────────────────────────
  
  loki:
    image: grafana/loki:2.9.0
    container_name: rag_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - rag_net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: rag_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      # Доступ к логам всех контейнеров Docker на хосте
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - rag_net
    depends_on:
      - loki


volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  rabbitmq_data:
  fastembed_cache:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  rag_net:
    driver: bridge
