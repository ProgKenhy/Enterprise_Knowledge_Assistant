  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./monitoring/dashboards:/var/lib/grafana/dashboards
  #   networks:
  #     - rag_net


volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  rabbitmq_data:
  fastembed_cache:

networks:
  rag_net:
    driver: bridge
